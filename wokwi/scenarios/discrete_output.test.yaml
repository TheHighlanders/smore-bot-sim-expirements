name: Digital + relay output over the base controller
version: 1
author: p1am-wokwi-lab
# System-level integration test for the discrete-output path (SPI -> base
# controller chip -> OUT pins). Slot 1 is a P1-15TD1 (15-ch digital out),
# slot 2 is a P1-08TRS relay. Run with:
#   wokwi-cli . --scenario wokwi/scenarios/discrete_output.test.yaml
steps:
  - wait-serial: 'Base online. Modules found: 4'
  - wait-serial: 'slot 1: P1-15TD1'
  - wait-serial: 'Ready'

  # Press 1 -> chase step 0 -> digital channel 1 (S1_01); relay held while pressed.
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - wait-serial: 'DO step 0 mask=0x1'
  - expect-pin: { part-id: base, pin: S1_01, value: 1 }
  - expect-pin: { part-id: base, pin: S2_1,  value: 1 }
  - set-control: { part-id: btn, control: pressed, value: 0 }
  - delay: 100ms
  - expect-pin: { part-id: base, pin: S2_1,  value: 0 }

  # Press 2 -> chase step 1 -> digital channel 2 (S1_02), channel 1 back off.
  - set-control: { part-id: btn, control: pressed, value: 1 }
  - wait-serial: 'DO step 1 mask=0x2'
  - expect-pin: { part-id: base, pin: S1_02, value: 1 }
  - expect-pin: { part-id: base, pin: S1_01, value: 0 }
  - set-control: { part-id: btn, control: pressed, value: 0 }
