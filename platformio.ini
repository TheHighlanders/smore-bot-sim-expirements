; PlatformIO project for the P1AM Wokwi teaching lab.
;
;   pio run   -e pico     -> build RP2040 firmware for Wokwi (.pio/build/pico/)
;   pio test  -e native   -> run the host unit tests (no board, no simulator)
;
; The RP2040 is a STAND-IN for the P1AM's SAMD21: Wokwi's supported MCUs are
; AVR / ESP32 / a few STM32 / RP2040 -- no SAMD21/SAMD51.
; [ref: docs/references/wokwi/supported-hardware.md]
; Student code is unchanged; only the transport under P1AM_Sim differs.

[platformio]
default_envs = pico

; ---- Shared build settings ----
[env]
build_flags = -I shared              ; shared/ base_model.h + module_db.h

; ---- RP2040 firmware for Wokwi (Arduino / earlephilhower core) ----
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; Wokwi runs the .uf2/.elf that this env produces (see wokwi.toml).

; ---- Host unit tests (Unity), no hardware ----
[env:native]
platform = native
test_framework = unity
build_flags = -I shared -std=gnu++17
; src/main.cpp is Arduino-only and is NOT compiled for tests
; (PlatformIO's default test_build_src = no).
